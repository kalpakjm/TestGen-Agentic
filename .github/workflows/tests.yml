name: unit tests

on:
  push:
  pull_request:

jobs:
  tests:
    # The unit tests need neither Spark, Java nor an LLM, so they run quickly on hosted runners.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package
        run: python -m pip install -e .
      - name: Run the unit tests
        run: python -m pytest -q
      - name: Smoke test of the command line (offline, no Spark)
        run: ptagent analyze data/sample_projects/orders_no_tests
