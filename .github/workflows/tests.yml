name: unit tests

on:
  push:
  pull_request:

jobs:
  tests:
    # The unit tests need neither Spark, Java nor an LLM, so they run quickly on hosted runners.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package
        run: python -m pip install -e .
      - name: Run the unit tests
        run: python -m pytest -q -rf --junitxml=unit-tests.xml
      - name: Show failing tests as annotations
        if: failure()
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          from pathlib import Path
          path = Path("unit-tests.xml")
          if not path.exists():
              print("::error title=no test report::pytest wrote no report (collection or import error); see the step log")
          else:
              for case in ET.parse(path).getroot().iter("testcase"):
                  for problem in case.findall("failure") + case.findall("error"):
                      text = (problem.text or "").strip()
                      last = text.splitlines()[-1] if text else ""
                      detail = f"{problem.get('message') or ''} | {last}"
                      detail = detail.replace("%", "%25").replace("\r", "").replace("\n", " ")[:900]
                      print(f"::error title={case.get('classname')}::{case.get('name')}: {detail}")
      - name: Smoke test of the command line (offline, no Spark)
        run: ptagent analyze data/sample_projects/orders_no_tests
