# Baseline configuration for the PySpark test-generation agents.
# All paths are relative to the repository root unless absolute.

llm:
  backend: offline            # offline (default) | ollama (local, free) | openai | gemini | anthropic (hosted, need an API key)
  ollama_url: http://localhost:11434
  ollama_model: qwen2.5-coder:3b
  # Hosted providers: set the key in an environment variable, never in this file
  #   OPENAI_API_KEY | GEMINI_API_KEY (or GOOGLE_API_KEY) | ANTHROPIC_API_KEY
  # These send your function source code to the provider and are billed by it. Check the model names with the provider.
  openai_model: gpt-4o-mini
  openai_base_url: ""         # empty = api.openai.com; any OpenAI-compatible server works (LM Studio, vLLM, Azure gateway ...)
  gemini_model: gemini-3.8-flash
  anthropic_model: claude-sonnet-5-5
  timeout_s: 120
  temperature: 0.1

paths:
  output_dir: outputs
  dbr_rules: knowledge/dbr_rules.json
  guidelines: knowledge/testing_guidelines.md
  prompts_dir: prompts

analysis:
  dataframe_param_names: [df, input_df, sdf, data]
  entry_point_names: [main]
  skip_dirs: [.git, __pycache__, .venv, venv, node_modules, outputs, .ipynb_checkpoints, build, dist, .pytest_cache]

verification:
  run_tests: auto             # auto (run if pytest, pyspark, coverage and java exist) | always | never
  max_repair_attempts: 2
  coverage_target: 80
  timeout_s: 900
  ignore_project_addopts: true   # ignore the project's own pytest 'addopts' (such as --cov flags that need extra plugins)

runtime_upgrade:
  from_dbr: "13.3"
  to_dbr: "17.3"
