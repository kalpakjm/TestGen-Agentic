<!doctype html><html><body><h1 class="anchor">Migration Guide: SQL<a class="hash-link" href="#x" title="Direct link">​</a></h1><h2 class="anchor">Upgrading from Spark SQL 3.5 to 4.0<a class="hash-link" href="#x" title="Direct link">​</a></h2><ul><li>Since Spark 4.0, <code>spark.sql.ansi.enabled</code> is on by default. To restore the previous behavior, set <code>spark.sql.ansi.enabled</code> to <code>false</code>.</li><li>Since Spark 4.0, the table property format changed and nothing in user code is affected.</li></ul></body></html>
